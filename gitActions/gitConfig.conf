# ===============================================================
# 🧩 GIT UPLOAD AUTOMATION CONFIGURATION FILE
# ---------------------------------------------------------------
# This file defines the project and GitHub settings for automated 
# uploads and report tracking via GitHub Actions and Pages.
# ===============================================================


# === 🧱 BASIC CONFIGURATION ===
# Change based on your project name
PROJECT_NAME = AF                
GIT_ACCESS_TOKEN = ${GIT_ACCESS_TOKEN}
# GitHub username or organization name
GITHUB_OWNER = 4noles  
# Target repository name
GITHUB_REPO = Reports  
# Branch to clone from / merge into (usually main)
GITHUB_BRANCH = main
# Optional: push directly to a different unprotected branch instead of GITHUB_BRANCH
# Leave blank when using UPLOAD_MODE = pull-request
GITHUB_PUSH_BRANCH =
# Upload strategy: direct (default) or pull-request (for protected main)
UPLOAD_MODE = pull-request
# Folder path in the repo where uploads will go
UPLOAD_PATH = regression-test-report 
# Local folder containing the files to upload
UPLOAD_SOURCE = playwright-report         


# === ⚙️ GITHUB TRACEABILITY SETTINGS ===
# These settings control workflow detection and GitHub Pages readiness checks.
WORKFLOW_DETECTION_TIMEOUT = 150  
WORKFLOW_POLL_INTERVAL = 7                  
PAGES_READY_TIMEOUT = 300                
PAGES_CHECK_INTERVAL = 10                 